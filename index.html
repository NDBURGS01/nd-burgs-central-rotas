<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191c">
  <meta name="description" content="ND BURGS - Sistema de pedidos e entregas.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>ND BURGS</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191c;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
    #app{width:100%;height:100%;height:100dvh;border:0;display:block;background:#17191c}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#17191c;z-index:2;text-align:center;padding:24px}
    .brand{font-weight:900;letter-spacing:.16em;font-size:clamp(24px,5vw,42px)}.accent{color:#ff7a1a}.sub{color:#aeb4bb;margin-top:12px;font-size:13px;letter-spacing:.08em}
    .error{max-width:560px;color:#ffb17e;line-height:1.5;margin-top:20px;font-size:13px}
  </style>
</head>
<body>
  <div id="loading"><div><div class="brand">ND <span class="accent">BURGS</span></div><div class="sub">CARREGANDO SISTEMA...</div><div id="error" class="error" hidden>NÃO FOI POSSÍVEL CONFIGURAR A CONEXÃO COM O SERVIDOR. CONFIRA A URL DO GOOGLE APPS SCRIPT E SE A INCORPORAÇÃO ESTÁ LIBERADA NO DOGET.</div></div></div>
  <iframe id="app" title="Sistema ND BURGS" allow="geolocation; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
  <script>
    // COLE AQUI A URL DA IMPLANTACAO DO GOOGLE APPS SCRIPT TERMINADA EM /exec.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2SRJUvUocGtGoCMZSKL3isp51CPhe5K-ChmNlQC7Y7mhwQ9L3zzts_QRTdErY6KkH/exec';
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    if (!APPS_SCRIPT_URL.startsWith('https://script.google.com/macros/s/') || !APPS_SCRIPT_URL.endsWith('/exec')) {
      error.hidden = false;
    } else {
      const params = new URLSearchParams(location.search);
      const route = new URLSearchParams();
      if (params.has('pedido')) route.set('pedido', params.get('pedido'));
      if (params.has('mapa')) route.set('mapa', params.get('mapa'));
      frame.src = APPS_SCRIPT_URL + (route.toString() ? '?' + route.toString() : '');
      frame.hidden = false;
      frame.addEventListener('load', () => { loading.style.display = 'none'; });
      setTimeout(() => { if (loading.style.display !== 'none') loading.querySelector('.sub').textContent = 'CONECTANDO AO SERVIDOR...'; }, 8000);
    }
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
