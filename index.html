<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>ND BURGS | Acompanhe seu motoboy</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#343741;--text:#f5f5f5;--muted:#aeb3bf;--blue:#2388ff;--green:#159b62}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#182438 0,#101114 55%);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
    main{width:min(100%,440px);padding:28px 22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 18px 60px #0008;text-align:center}
    .logo{width:58px;height:58px;margin:0 auto 14px;display:grid;place-items:center;border-radius:16px;background:var(--blue);font-size:25px;font-weight:950;letter-spacing:-1px}
    h1{font-size:23px;margin:0 0 5px}p{margin:7px 0;color:var(--muted)}.driver{margin:18px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#111318;font-weight:850;letter-spacing:.5px}
    .spinner{width:26px;height:26px;margin:18px auto 8px;border:3px solid #ffffff25;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .error{display:none;margin-top:16px;padding:13px;border:1px solid #8d4242;border-radius:12px;background:#351b1b;color:#ffd7d7}.error a{color:#fff;font-weight:800}.small{font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <div class="logo">ND</div>
    <h1>ND BURGS</h1>
    <p>Acompanhamento de entrega</p>
    <div class="driver" id="driver">Identificando motoboy…</div>
    <div class="spinner" id="spinner"></div>
    <p id="message">Conectando ao mapa de localização em tempo real.</p>
    <div class="error" id="error"></div>
    <p class="small">A localização aparece somente enquanto o motoboy estiver compartilhando o GPS.</p>
  </main>
  <script>
    // URL publicada do Google Apps Script que mantém os dados e o mapa ao vivo.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7BQGfh7l9gNaoPv6SlvguQp9tPJHLy__ZYZ64BNmxnN9B995R-0LIsyyiNZ0UM-3lYA/exec';
    const allowed = ['DANILO', 'THIAGUINHO', 'NEEH'];
    const params = new URLSearchParams(window.location.search);
    const driver = (params.get('motoboy') || '').trim().toUpperCase();
    const box = document.getElementById('error');

    if (!allowed.includes(driver)) {
      document.getElementById('driver').textContent = 'LINK NÃO IDENTIFICADO';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('message').textContent = 'Este link precisa identificar um motoboy válido.';
      box.style.display = 'block';
      box.textContent = 'Peça à ND BURGS o link individual correto para acompanhar a entrega.';
    } else {
      document.title = 'ND BURGS | Motoboy ' + driver;
      document.getElementById('driver').textContent = 'MOTOBOY: ' + driver;
      const destination = APPS_SCRIPT_URL + '?motoboy=' + encodeURIComponent(driver);
      document.getElementById('message').textContent = 'Abrindo a localização exclusiva de ' + driver + '…';
      // Redireciona para o mapa real, servido pelo Apps Script e conectado ao GPS.
      window.location.replace(destination);
      // Fallback caso o navegador bloqueie o redirecionamento automático.
      setTimeout(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('message').textContent = 'Se o mapa não abrir automaticamente, toque abaixo.';
        box.style.display = 'block';
        box.innerHTML = '<a href="' + destination + '">ABRIR MAPA DE ' + driver + '</a>';
      }, 2500);
    }
  </script>
</body>
</html>
